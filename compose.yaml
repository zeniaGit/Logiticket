services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL with the Coolify PostgreSQL internal URL}
    expose:
      - "3001"
    volumes:
      - logiticket_uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  logiticket_uploads:
